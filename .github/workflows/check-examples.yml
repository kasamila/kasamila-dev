name: Public documentation and examples
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: node --test examples/audio-bridge/bridge.test.mjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: examples/realtime-integrations
      - run: npm test
        working-directory: examples/realtime-integrations
      - run: node --check examples/realtime-integrations/server.mjs
      - run: node --check examples/realtime-integrations/public/app.mjs
      - run: python -m py_compile examples/realtime-integrations/providers/doubao-hook.py
      - run: python -m unittest discover -s examples/realtime-integrations/tests -p "*_test.py"
      - run: node scripts/check_docs.mjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: examples/geometry-runtime-web
      - run: node --check examples/geometry-runtime-web/server.mjs
      - run: node --check examples/geometry-runtime-web/public/app.js
      - run: python scripts/package_template_hls.py --help
