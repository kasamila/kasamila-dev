<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark"><title>Kasamila · Application demos</title><link rel="icon" href="/kasamila-icon.svg"><link rel="stylesheet" href="/web/portal/styles.css?v=5"><link rel="stylesheet" href="/web/portal/landing.css?v=12"><link rel="stylesheet" href="/web/portal/applications.css?v=1"></head>
<body class="landing applications-page">
<header class="landing-header"><a class="landing-brand" href="/portal"><img src="/web/kasamila-logo.svg" alt="Kasamila"></a><nav class="landing-nav"><a href="/portal/apps" data-demo-copy="heading"></a><a href="/portal/use-cases" data-i18n="nav.useCases"></a><a href="/portal/avatars" data-i18n="nav.avatars"></a><a href="https://github.com/kasamila/kasamila-dev" data-i18n="nav.developers"></a></nav><label class="language-control"><span class="visually-hidden" data-i18n="language.label"></span><select aria-label="Language"></select></label></header>
<main class="applications-main">
<section id="gallery"><div class="applications-intro"><p class="eyebrow">KASAMILA IN ACTION</p><h1 data-demo-copy="heading"></h1><p data-demo-copy="intro"></p></div><div class="application-cards"><a class="application-card available" href="/portal/apps/chat"><img src="/web/portal/media/demo-portrait-friendly-v1.webp" alt=""><div><span class="application-tag" data-demo-copy="available"></span><h2 data-demo-copy="chat"></h2><p data-demo-copy="chatIntro"></p><span class="application-link" data-demo-copy="try"></span></div></a><article class="application-card"><img src="/web/portal/media/demo-presenter-v1.webp" alt=""><div><span class="application-tag future" data-demo-copy="coming"></span><h2>YouTube · Twitch</h2><p data-demo-copy="liveIntro"></p></div></article><article class="application-card"><img src="/web/portal/media/demo-portrait-male-v1.webp" alt=""><div><span class="application-tag future" data-demo-copy="coming"></span><h2 data-demo-copy="commerce"></h2><p data-demo-copy="commerceIntro"></p></div></article></div></section>
<section id="chat-demo" hidden><div class="chat-heading"><div><a href="/portal/apps" data-demo-copy="back"></a><h1 data-demo-copy="chat"></h1><p data-demo-copy="chatIntro"></p></div><span class="application-tag">LIVE AI</span></div>
<div class="chat-layout"><section class="chat-stage"><div id="demo-stage"><img id="demo-poster" src="/web/portal/media/demo-portrait-friendly-v1.webp" alt=""></div><div class="stage-caption"><strong id="demo-avatar-name">Kasamila</strong><span id="demo-status" role="status" aria-live="polite"></span></div></section>
<section class="chat-console"><div class="demo-options"><label><span data-demo-copy="avatar"></span><select id="demo-avatar"></select></label><label><span data-demo-copy="provider"></span><select id="demo-channel"></select></label></div><div id="demo-history" role="log" aria-live="polite" aria-relevant="additions text"></div>
<div class="demo-consent"><label><input id="demo-consent" type="checkbox"><span data-demo-copy="consent"></span></label><a href="/portal/privacy-policy" data-demo-copy="privacy"></a></div>
<div class="session-controls"><button id="demo-start" type="button" class="primary" data-demo-copy="start"></button><button id="demo-end" type="button" disabled data-demo-copy="end"></button></div><div class="speech-controls"><button id="demo-mic" type="button" aria-pressed="false" disabled data-demo-copy="mic"></button><button id="demo-interrupt" type="button" disabled data-demo-copy="interrupt"></button><button id="demo-mute" type="button" aria-pressed="false" disabled data-demo-copy="mute"></button></div>
<p id="demo-channel-note" class="demo-note" role="status" hidden></p><form id="demo-text-form"><label class="visually-hidden" for="demo-text" data-demo-copy="input"></label><textarea id="demo-text" rows="2" maxlength="2000" disabled></textarea><button id="demo-send" type="submit" disabled data-demo-copy="send"></button></form><p class="demo-note" data-demo-copy="note"></p></section></div></section>
</main><footer class="applications-footer"><a href="/portal/privacy-policy" data-demo-copy="privacy"></a><span>© Kasamila</span><a href="https://github.com/kasamila/kasamila-dev" data-i18n="nav.developers"></a></footer>
<script type="module" src="/web/portal/site-shell.js?v=8"></script><script type="module" src="/web/portal/applications.js?v=3"></script></body></html>
