<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="color-scheme" content="dark"><title>Shopify实时店员 · Kasamila</title><link rel="icon" href="/kasamila-icon.svg"><link rel="stylesheet" href="/web/portal/styles.css?v=5"><link rel="stylesheet" href="/web/portal/landing.css?v=12"><link rel="stylesheet" href="/web/portal/shopify.css?v=1"></head><body class="landing shopify-page">
<header class="landing-header"><a class="landing-brand" href="/portal/apps"><img src="/kasamila-icon.svg" alt="">KASAMILA</a><nav class="landing-nav"><a href="/portal/apps" data-demo="back"></a><a href="/portal/privacy-policy" data-demo="privacy"></a></nav><label class="language-control"><select aria-label="Language"></select></label></header>
<main class="shop-main"><div class="shop-heading"><p class="eyebrow">KASAMILA × SHOPIFY</p><h1 data-shop="title"></h1><p data-shop="intro"></p></div>
<div class="shop-toolbar"><label><span data-shop="store"></span><select id="shop-store"></select></label><label><span data-shop="country"></span><select id="shop-country"></select></label><form id="shop-search-form"><label class="visually-hidden" for="shop-search" data-shop="search"></label><input id="shop-search" type="search" maxlength="200"><button type="submit" data-shop="search"></button></form></div>
<p id="shop-message" role="status" aria-live="polite"></p><div class="shop-layout" id="shop-experience" hidden>
<section class="shop-products"><article id="shop-focus" aria-live="polite"></article><div id="shop-product-list" class="shop-product-list"></div><button id="shop-more" type="button" hidden data-shop="more"></button><details class="shop-policies"><summary data-shop="policies"></summary><div id="shop-policies"></div></details><p class="shop-note" data-shop="note"></p></section>
<aside class="shop-assistant"><div id="shop-stage"></div><div class="shop-assistant-name"><strong id="shop-avatar-name"></strong><span id="shop-status" role="status"></span></div><div id="shop-history" role="log" aria-live="polite" aria-relevant="additions text"></div><label class="shop-consent"><input id="shop-consent" type="checkbox"><span data-demo="consent"></span></label><div class="shop-controls"><button type="button" id="shop-start" class="primary" data-demo="start"></button><button type="button" id="shop-end" disabled data-demo="end"></button><button type="button" id="shop-mic" disabled aria-pressed="false" data-demo="mic"></button><button type="button" id="shop-interrupt" disabled data-demo="interrupt"></button><button type="button" id="shop-mute" disabled aria-pressed="false" data-demo="mute"></button></div><form id="shop-chat-form"><label class="visually-hidden" for="shop-text" data-demo="input"></label><textarea id="shop-text" rows="2" maxlength="2000" disabled></textarea><button id="shop-send" type="submit" disabled data-demo="send"></button></form></aside></div>
<details id="shop-merchant" class="shop-merchant"><summary data-shop="merchant"></summary><label>Shopify<input id="merchant-shop" type="url" value="https://kasamila.myshopify.com" autocomplete="url"></label><label class="shop-consent"><input id="merchant-consent" type="checkbox"><span data-shop="authorize"></span></label><button id="merchant-authorize" type="button" data-shop="authorize"></button><a href="/api/v1/admin/portal/shopify/manage" target="_blank" rel="noopener">Admin →</a></details>
</main><script type="module" src="/web/portal/site-shell.js?v=8"></script><script type="module" src="/web/portal/shopify.js?v=1"></script></body></html>
