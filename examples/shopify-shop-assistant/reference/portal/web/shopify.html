<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="color-scheme" content="dark"><title>Shopify实时店员 · Kasamila</title><link rel="icon" href="/kasamila-icon.svg"><link rel="stylesheet" href="/web/portal/styles.css?v=5"><link rel="stylesheet" href="/web/portal/shopify.css?v=6"></head><body class="shopify-page">
<div id="shop-launcher"><button id="shop-launch" type="button" disabled aria-expanded="false" aria-controls="shop-panel"><img id="shop-launch-avatar" src="/web/portal/media/demo-portrait-friendly-v1.webp" alt=""><span data-shop="launch"></span></button><p id="shop-launch-note" data-shop="launchNotice"></p><a href="/portal/privacy-policy" target="_blank" rel="noopener" data-demo="privacy"></a><p id="shop-launch-status" role="status"></p></div>
<main id="shop-panel" hidden><header class="shop-header"><a class="shop-brand" href="/portal/apps"><img src="/kasamila-icon.svg" alt="">KASAMILA</a><h1 data-shop="title"></h1><div class="shop-top-controls"><button id="shop-browse" type="button" data-shop="allProducts"></button><label><span class="visually-hidden" data-shop="store"></span><select id="shop-store"></select></label><label><span class="visually-hidden" data-shop="country"></span><select id="shop-country"></select></label><label class="language-control"><select aria-label="Language"></select></label><button id="shop-end" type="button" data-shop="collapse"></button></div></header>
<section id="shop-experience" class="shop-scene"><div class="shop-avatar-area"><div id="shop-stage"></div><div class="shop-identity"><strong id="shop-avatar-name"></strong><span data-shop="aiAssistant"></span><span id="shop-status" role="status"></span><button id="shop-retry" type="button" hidden data-demo="start"></button></div><div id="shop-welcome"><h2 data-shop="welcome"></h2><p data-shop="welcomeHint"></p></div></div><div class="shop-captions"><p id="shop-user-turn" class="shop-user-turn" hidden></p><p id="shop-subtitle" aria-live="polite"></p></div><article id="shop-focus" hidden></article></section>
<div class="shop-context-bar"><div id="shop-recommendations"></div><button id="shop-next" type="button" hidden data-shop="nextProduct"></button><button id="shop-history-toggle" type="button" data-shop="history"></button></div>
<footer class="shop-footer"><p id="shop-message" role="status" aria-live="polite"></p><form id="shop-chat-form"><button type="button" id="shop-mic" disabled aria-pressed="false" data-demo="mic"></button><label class="visually-hidden" for="shop-text" data-demo="input"></label><textarea id="shop-text" rows="1" maxlength="2000" disabled></textarea><button id="shop-send" type="submit" disabled data-demo="send"></button><button type="button" id="shop-interrupt" disabled data-demo="interrupt"></button><button type="button" id="shop-mute" disabled aria-pressed="false" data-demo="mute"></button></form><p class="shop-disclosure" data-shop="aiDisclosure"></p></footer></main>
<dialog id="shop-drawer"><div class="shop-dialog-heading"><h2 data-shop="allProducts"></h2><button data-close="shop-drawer" type="button" data-shop="close"></button></div><form id="shop-search-form"><input id="shop-search" type="search" maxlength="200" aria-label="Search"><button type="submit" data-shop="search"></button></form><div id="shop-product-list"></div><button id="shop-more" type="button" hidden data-shop="more"></button><details><summary data-shop="policies"></summary><div id="shop-policies"></div></details><p class="shop-note" data-shop="note"></p></dialog>
<dialog id="shop-product-dialog"><div class="shop-dialog-heading"><h2 data-shop="details"></h2><button data-close="shop-product-dialog" type="button" data-shop="close"></button></div><div id="shop-product-details"></div></dialog>
<dialog id="shop-history-dialog"><div class="shop-dialog-heading"><h2 data-shop="history"></h2><button data-close="shop-history-dialog" type="button" data-shop="close"></button></div><div id="shop-history" role="log" aria-live="polite"></div></dialog>
<script type="module" src="/web/portal/site-shell.js?v=20261017"></script><script type="module" src="/web/portal/shopify.js?v=20261017"></script></body></html>
